<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Cabeçalho principal da página -->
    <header class="topo">
        <h1>Carrinho de Compras</h1>
        <p>Escolha os produtos e acompanhe o total da compra.</p>
    </header>

    <main class="container">
        <!-- Área onde os produtos fixos do array aparecem na tela -->
        <section class="painel produtos-area">
            <div class="titulo-linha">
                <h2>Produtos</h2>

                <!-- O select dispara o filtro de produtos pelo preço -->
                <label for="filtroProdutos">
                    Filtrar:
                    <select id="filtroProdutos">
                        <option value="todos">Todos</option>
                        <option value="ate50">Até R$50</option>
                        <option value="acima50">Acima de R$50</option>
                    </select>
                </label>
            </div>

            <div id="listaProdutos" class="lista-produtos"></div>
        </section>

        <!-- Área que mostra os produtos adicionados ao carrinho -->
        <section class="painel carrinho-area">
            <div class="titulo-linha">
                <h2>Carrinho</h2>
                <button id="limparCarrinho" class="botao-secundario">Limpar</button>
            </div>

            <div id="listaCarrinho" class="lista-carrinho"></div>

            <!-- Campo opcional para aplicar desconto percentual no total -->
            <div class="desconto-area">
                <label for="desconto">Desconto (%)</label>
                <input type="number" id="desconto" min="0" max="100" value="0">
            </div>

            <!-- O JavaScript atualiza este valor automaticamente -->
            <div class="total-area">
                <span>Total:</span>
                <strong id="totalCompra">R$ 0,00</strong>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
